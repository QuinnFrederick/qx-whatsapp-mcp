[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Very Good Plugins", email = "support@verygoodplugins.com" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # cryptography 49+ no longer publishes Intel macOS wheels. Keep the
    # developer-laptop install path working until the project deliberately
    # drops x86_64 macOS support.
    "cryptography>=50.0.2,<51",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
    "requests>=2.34.2",
    "anyio<4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[project.urls]
Homepage = "https://github.com/QuinnFrederick/qx-whatsapp-mcp"
Repository = "https://github.com/QuinnFrederick/qx-whatsapp-mcp"
Issues = "https://github.com/QuinnFrederick/qx-whatsapp-mcp/issues"
Upstream = "https://github.com/verygoodplugins/whatsapp-mcp"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "mcp_config", "parent_watchdog"]

[tool.mcp]
name = "io.github.QuinnFrederick/qx-whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
